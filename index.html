<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repair of equipment from various brands — CPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">
  <section class="brands" aria-labelledby="brands-title">
    <header class="brands__header">
      <div class="brands__container">
        <h2 class="brands__title" id="brands-title">Repair of equipment from various brands</h2>
      </div>
    </header>

    <div class="brands__container brands__body">
      <div class="brands__slider swiper" id="brands-slider">
        <ul class="brands__list swiper-wrapper">
          <li class="brands__item swiper-slide">
            <div class="brands__card">
              <a class="brands__link" href="#lenovo" aria-label="Lenovo repair">
                <img class="brands__logo" src="img/lenovo.svg" alt="Lenovo" width="108" height="23">
              </a>
              <button class="brands__go" type="button" aria-label="Next brand">
                <img class="brands__go-icon" src="img/go.svg" alt="" width="40" height="40" aria-hidden="true">
              </button>
            </div>
          </li>
          <li class="brands__item swiper-slide">
            <div class="brands__card">
              <a class="brands__link" href="#samsung" aria-label="Samsung repair">
                <img class="brands__logo" src="img/samsung.svg" alt="Samsung" width="116" height="39">
              </a>
              <button class="brands__go" type="button" aria-label="Next brand">
                <img class="brands__go-icon" src="img/go.svg" alt="" width="40" height="40" aria-hidden="true">
              </button>
            </div>
          </li>
          <li class="brands__item swiper-slide">
            <div class="brands__card">
              <a class="brands__link" href="#apple" aria-label="Apple repair">
                <img class="brands__logo" src="img/apple.svg" alt="Apple" width="35" height="44">
              </a>
              <button class="brands__go" type="button" aria-label="Next brand">
                <img class="brands__go-icon" src="img/go.svg" alt="" width="40" height="40" aria-hidden="true">
              </button>
            </div>
          </li>
          <li class="brands__item swiper-slide">
            <div class="brands__card">
              <a class="brands__link" href="#viewsonic" aria-label="ViewSonic repair">
                <img class="brands__logo" src="img/viewsonic.svg" alt="ViewSonic" width="128" height="21">
              </a>
              <button class="brands__go" type="button" aria-label="Next brand">
                <img class="brands__go-icon" src="img/go.svg" alt="" width="40" height="40" aria-hidden="true">
              </button>
            </div>
          </li>
          <li class="brands__item swiper-slide">
            <div class="brands__card">
              <a class="brands__link" href="#bosch" aria-label="Bosch repair">
                <img class="brands__logo" src="img/bosch.svg" alt="Bosch" width="128" height="29">
              </a>
              <button class="brands__go" type="button" aria-label="Next brand">
                <img class="brands__go-icon" src="img/go.svg" alt="" width="40" height="40" aria-hidden="true">
              </button>
            </div>
          </li>
          <li class="brands__item swiper-slide">
            <div class="brands__card">
              <a class="brands__link" href="#hp" aria-label="HP repair">
                <img class="brands__logo" src="img/hp.svg" alt="HP" width="44" height="44">
              </a>
              <button class="brands__go" type="button" aria-label="Next brand">
                <img class="brands__go-icon" src="img/go.svg" alt="" width="40" height="40" aria-hidden="true">
              </button>
            </div>
          </li>
          <li class="brands__item swiper-slide">
            <div class="brands__card">
              <a class="brands__link" href="#acer" aria-label="Acer repair">
                <img class="brands__logo" src="img/acer.svg" alt="Acer" width="94" height="24">
              </a>
              <button class="brands__go" type="button" aria-label="Next brand">
                <img class="brands__go-icon" src="img/go.svg" alt="" width="40" height="40" aria-hidden="true">
              </button>
            </div>
          </li>
          <li class="brands__item swiper-slide">
            <div class="brands__card">
              <a class="brands__link" href="#sony" aria-label="Sony repair">
                <img class="brands__logo" src="img/sony.svg" alt="Sony" width="128" height="23">
              </a>
              <button class="brands__go" type="button" aria-label="Next brand">
                <img class="brands__go-icon" src="img/go.svg" alt="" width="40" height="40" aria-hidden="true">
              </button>
            </div>
          </li>
          <li class="brands__item swiper-slide">
            <div class="brands__card">
              <a class="brands__link" href="#lenovo-more" aria-label="Lenovo repair">
                <img class="brands__logo" src="img/lenovo.svg" alt="Lenovo" width="108" height="23">
              </a>
              <button class="brands__go" type="button" aria-label="Next brand">
                <img class="brands__go-icon" src="img/go.svg" alt="" width="40" height="40" aria-hidden="true">
              </button>
            </div>
          </li>
          <li class="brands__item swiper-slide">
            <div class="brands__card">
              <a class="brands__link" href="#samsung-more" aria-label="Samsung repair">
                <img class="brands__logo" src="img/samsung.svg" alt="Samsung" width="116" height="39">
              </a>
              <button class="brands__go" type="button" aria-label="Next brand">
                <img class="brands__go-icon" src="img/go.svg" alt="" width="40" height="40" aria-hidden="true">
              </button>
            </div>
          </li>
          <li class="brands__item swiper-slide">
            <div class="brands__card">
              <a class="brands__link" href="#apple-more" aria-label="Apple repair">
                <img class="brands__logo" src="img/apple.svg" alt="Apple" width="35" height="44">
              </a>
              <button class="brands__go" type="button" aria-label="Next brand">
                <img class="brands__go-icon" src="img/go.svg" alt="" width="40" height="40" aria-hidden="true">
              </button>
            </div>
          </li>
        </ul>
      </div>

      <button class="brands__toggle" type="button" aria-expanded="false" aria-controls="brands-slider">
        <img class="brands__toggle-icon" src="img/expand.svg" alt="" width="24" height="24" aria-hidden="true">
        <span class="brands__toggle-text">Show all</span>
      </button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
